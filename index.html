<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>숫자 버튼</title>
  <style>
    #buttons {
      display: grid;
      grid-template-columns: repeat(5, 150px);
      gap: 40px;
    }
    #buttons button {
      width: 150px;
      height: 150px;
      font-size: 2rem;
    }
  </style>
</head>
<body>
  <div id="buttons"></div>

  <script>
    var box = document.getElementById("buttons");
    for (var i = 1; i <= 10; i++) {
      var btn = document.createElement("button");
      btn.textContent = i;
      btn.onclick = function () {
        alert(this.textContent + "번이 나왔습니다.");
      };
      box.appendChild(btn);
    }
  </script>
</body>
</html>
